[project]
name = "appmod"
version = "0.2.0"
description = "Agentic App Modernization pipeline (blueprint v3) — kernel, Astra-backed agents, console"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openpyxl>=3.1",
  "jsonschema>=4.21",
  "openai>=2.48",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "sqlglot>=25",
  "mcp>=1.2",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["appmod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls the live Astra endpoint (run with APPMOD_LIVE=1)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E731", "E741"]
